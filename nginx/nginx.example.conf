# WebSocket upgrade helper: "upgrade" for WS requests, "close" otherwise.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

gzip on;
gzip_types application/json text/plain;

limit_req_zone $binary_remote_addr zone=api:10m rate=60r/m;

# ---------------------------------------------------------------------
#  HTTP -> HTTPS redirect (both domains)
# ---------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name your_domain_name your_livekit_domain_name;
    return 301 https://$host$request_uri;
}

# ─── HTTPS: Backend API ──────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name your_domain_name;

    ssl_certificate     your_certificate.pem;
    ssl_certificate_key your_private_key.key;
    ssl_prefer_server_ciphers off;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Frame-Options        DENY    always;
    add_header X-Content-Type-Options nosniff always;



    # Rate Limiting
    limit_req zone=api burst=10 nodelay;

    location / {
        proxy_pass         http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection $connection_upgrade;
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP  $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}

# ─── HTTPS: LiveKit WebSocket ────────────────────────────
upstream livekit_upstream {
    server localhost:7880;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl; 
    http2 on;
    server_name your_livekit_domain_name;
    
    ssl_certificate     your_certificate.pem;
    ssl_certificate_key your_private_key.key;
    ssl_protocols	    TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;

    
    location / {
        proxy_pass         http://livekit_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection $connection_upgrade;
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP  $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
