name: CI

on:
  push:
    # Tags are handled by the release workflow, which calls this one.
    branches: ['**']
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Typecheck, build & test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        # Same major version as docker/docker-compose.yml
        image: postgres:18-alpine
        env:
          POSTGRES_USER: motovoice
          POSTGRES_PASSWORD: motovoice
          POSTGRES_DB: motovoice
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U motovoice"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # The tests create and use "motovoice_test" next to this database.
      POSTGRES_URL: postgresql://motovoice:motovoice@localhost:5432/motovoice

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm run test:coverage

  docker:
    name: Docker build
    # Releases build and push the image themselves.
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha,scope=ci
          cache-to: type=gha,mode=max,scope=ci
