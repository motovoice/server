services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-motovoice}
      POSTGRES_USER: ${POSTGRES_USER:-motovoice}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-motovoice}"]
      interval: 10s
      timeout: 5s
      retries: 5

  livekit:
    image: livekit/livekit-server:latest
    network_mode: host
    restart: unless-stopped
    command: --config /etc/livekit/config.yaml
    environment:
      LIVEKIT_URL: ${LIVEKIT_URL}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET}
    volumes:
      - ./livekit/config.yaml:/etc/livekit/config.yaml:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7880 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  backend:
    image: ghcr.io/motovoice/server:latest
    restart: unless-stopped
    environment:
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      JWT_SECRET: ${JWT_SECRET}
      SERVER_PASSWORD: ${SERVER_PASSWORD:-}
      STATS_TOKEN: ${STATS_TOKEN:-}
      POSTGRES_URL: postgresql://${POSTGRES_USER:-motovoice}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-motovoice}
      LIVEKIT_URL: ${LIVEKIT_URL}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET}
    ports:
      - "127.0.0.1:3000:3000"
      - "[::1]:3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      livekit:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  pg_data:
